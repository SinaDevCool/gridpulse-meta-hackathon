[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpulse-grid-core"
version = "0.2.0"
description = "Canonical grid contracts, source ingestion, and electrical-study providers for GridPulse."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
production = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "shapely>=2.0,<3",
  "pyproj>=3.6,<4",
  "osmium>=4,<5",
  "neo4j>=6,<7",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
analytics = ["gridpulse-capacity-backtest>=0.2,<0.3"]
study = [
  "pandapower>=3,<4",
  "simbench>=1.6,<2",
  "pandas>=2.2,<3",
  "numpy>=1.26,<2",
  "scipy>=1.11,<2",
  "pypower>=5.1.19,<6",
  "cryptography>=43,<50",
]
ml = [
  "numpy>=1.26,<2",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
]
dev = ["pytest>=8,<9", "ruff==0.16.0", "httpx2>=2,<3", "PyYAML>=6,<7"]

[project.scripts]
grid-data = "grid_data.cli:main"
grid-data-worker = "grid_data.api.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"src/grid_data/api/app.py" = ["B008"]
"src/grid_data/api/routers/*.py" = ["B008"] # FastAPI Depends defaults moved from app.py

