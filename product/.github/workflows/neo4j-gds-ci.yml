name: Neo4j GDS integration

on:
  pull_request:
    paths: ["services/grid-data/src/grid_data/graph/**", "services/grid-data/scripts/validate_neo4j.py", "compose.neo4j.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/gridpulse-test-password
          NEO4J_PLUGINS: '["graph-data-science"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./services/grid-data[production,study]"
      - run: python services/grid-data/scripts/validate_neo4j.py
        env:
          NEO4J_URI: neo4j://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: gridpulse-test-password
