name: Grid source health

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

jobs:
  mastr-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check official MaStR export
        env:
          PYTHONPATH: services/grid-data/src
        run: >-
          python -m grid_data.cli check-mastr
          --output grid-source-health/mastr.json
      - name: Check national OpenStreetMap extract
        env:
          PYTHONPATH: services/grid-data/src
        run: >-
          python -m grid_data.cli check-geofabrik
          --output grid-source-health/geofabrik-germany.json
      - name: Snapshot official operator endpoints
        env:
          PYTHONPATH: services/grid-data/src
        run: >-
          python -m grid_data.cli fetch-operator-evidence
          --output grid-source-health/operator-evidence.json
      - name: Persist operator source checks
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          PYTHONPATH: services/grid-data/src
        run: >-
          python -m grid_data.cli publish-operator-health
          --input grid-source-health/operator-evidence.json
      - name: Refresh real SMARD forecast features
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          PYTHONPATH: services/grid-data/src
        run: >-
          python -m grid_data.cli ingest-grid-stress-smard
          --start-year "$(date -u +%Y)"
          --end-year "$(date -u +%Y)"
      - uses: actions/upload-artifact@v4
        with:
          name: grid-source-health
          path: grid-source-health/
          retention-days: 30
