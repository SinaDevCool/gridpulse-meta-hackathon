name: National grid-data ingestion

on:
  workflow_dispatch:
    inputs:
      extract:
        description: Geofabrik extract slug to ingest
        required: true
        default: berlin
      promote:
        description: Promote after external PostGIS staging validation
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Discover bounded official extracts
        env: { PYTHONPATH: services/grid-data/src }
        run: python -m grid_data.cli discover-geofabrik-states --output work/geofabrik-states.json
      - uses: actions/upload-artifact@v4
        with:
          name: geofabrik-state-manifest
          path: work/geofabrik-states.json
          retention-days: 30

  state-ingestion:
    needs: source-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e 'services/grid-data[production]'
      - uses: actions/download-artifact@v4
        with: { name: geofabrik-state-manifest, path: work }
      - name: Resolve immutable source
        id: source
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          manifest=json.load(open('work/geofabrik-states.json', encoding='utf-8'))
          slug=os.environ['EXTRACT']
          item=next((x for x in manifest['extracts'] if x['slug']==slug), None)
          if not item: raise SystemExit(f'unknown extract {slug}')
          print(f"url={item['url']}")
          print(f"md5={item['expected_md5']}")
          print(f"scope={','.join(item['federal_states'])}")
          PY
        env: { EXTRACT: "${{ inputs.extract }}" }
      - name: Download with resume
        env: { PYTHONPATH: services/grid-data/src }
        run: python -m grid_data.cli download --url '${{ steps.source.outputs.url }}' --output work/state.osm.pbf
      - name: Stream, validate, and quarantine rejects
        env: { PYTHONPATH: services/grid-data/src }
        run: >-
          python -m grid_data.cli parse-osm-pbf --input work/state.osm.pbf
          --output work/state.ndjson --expected-md5 '${{ steps.source.outputs.md5 }}'
          --geographic-scope '${{ steps.source.outputs.scope }}'
      - name: Build COPY staging files
        env: { PYTHONPATH: services/grid-data/src }
        run: python -m grid_data.cli write-osm-copy --input work/state.ndjson --output-dir work/copy
      - uses: actions/upload-artifact@v4
        with:
          name: osm-state-${{ inputs.extract }}
          path: |
            work/state.ndjson
            work/state.ndjson.report.json
            work/state.ndjson.rejected.ndjson
            work/state.osm.pbf.manifest.json
            work/copy/
          retention-days: 30

  staging-publication:
    needs: state-ingestion
    runs-on: ubuntu-latest
    environment: grid-data-production
    if: ${{ inputs.promote }}
    steps:
      - name: Require configured batch infrastructure
        env:
          DATABASE_URL: ${{ secrets.GRID_DATA_DATABASE_URL }}
          ARTIFACT_BUCKET: ${{ secrets.GRID_DATA_ARTIFACT_BUCKET }}
        run: |
          test -n "$DATABASE_URL" || { echo 'GRID_DATA_DATABASE_URL is required; release was not staged.'; exit 1; }
          test -n "$ARTIFACT_BUCKET" || { echo 'GRID_DATA_ARTIFACT_BUCKET is required; raw artifact was not preserved.'; exit 1; }
          echo 'External staging publisher must COPY the retained files and create the governed release IDs.'
          exit 1

  promotion:
    needs: staging-publication
    runs-on: ubuntu-latest
    if: ${{ inputs.promote }}
    steps:
      - run: echo 'Promotion remains blocked until staging publication returns an accepted release ID.' && exit 1

  viewport-smoke-tests:
    needs: promotion
    runs-on: ubuntu-latest
    if: ${{ inputs.promote }}
    steps:
      - run: echo 'Smoke tests run only after governed promotion.'

  neo4j-reconciliation:
    needs: promotion
    runs-on: ubuntu-latest
    if: ${{ inputs.promote }}
    steps:
      - run: echo 'Neo4j projection runs only from the accepted PostGIS release.'
