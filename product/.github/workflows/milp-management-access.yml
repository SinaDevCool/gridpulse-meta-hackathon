name: Check MILP migration credential (read only)

on:
  push:
    branches: [codex/production-milp-preflight]
    paths: [.github/workflows/milp-management-access.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'SinaDevCool/gridpulse' && github.ref == 'refs/heads/codex/production-milp-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify management access without applying SQL or displaying secrets
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, re, sys, urllib.error, urllib.parse, urllib.request
          sys.path.insert(0, 'scripts')
          from check_milp_storage import NoRedirect
          token = os.environ.get('SUPABASE_ACCESS_TOKEN', '')
          origin = urllib.parse.urlsplit(os.environ.get('SUPABASE_URL', ''))
          if not token:
              raise SystemExit('BLOCKED: SUPABASE_ACCESS_TOKEN is not available to this repository workflow')
          if origin.scheme != 'https' or not re.fullmatch(r'[a-z0-9]+\.supabase\.co', origin.hostname or ''):
              raise SystemExit('BLOCKED: expected hosted Supabase project origin is not configured')
          ref = origin.hostname.split('.')[0]
          opener = urllib.request.build_opener(NoRedirect())
          def read(path):
              request = urllib.request.Request('https://api.supabase.com/v1/projects/' + ref + path,
                  method='GET', headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json'})
              with opener.open(request, timeout=25) as response:
                  raw = response.read(3_000_001)
              if len(raw) > 3_000_000:
                  raise ValueError('Metadata size limit exceeded')
              return json.loads(raw)
          try:
              project = read('')
              if project.get('id') != ref:
                  raise ValueError('Project identity mismatch')
              history = read('/database/migrations')
              if not isinstance(history, list):
                  raise ValueError('Unexpected migration metadata')
          except urllib.error.HTTPError as error:
              raise SystemExit('BLOCKED: management access check returned HTTP ' + str(error.code)) from None
          except (OSError, ValueError, TypeError):
              raise SystemExit('BLOCKED: management access could not be verified') from None
          print(json.dumps({'secret_available': True, 'project_access_verified': True,
              'migration_history_read_verified': True,
              'approved_migration_recorded': any(str(row.get('version')) == '20261023180000' for row in history),
              'write_permission_tested': False, 'database_changes_made': False}))
          PY
