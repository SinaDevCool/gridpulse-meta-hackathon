name: Public MILP anonymous permission audit (read only)
on:
  push:
    branches: [codex/production-milp-runtime]
    paths: [scripts/audit_public_milp.py, .github/workflows/public-milp-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect permissions and auth configuration without changing them
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python scripts/audit_public_milp.py
