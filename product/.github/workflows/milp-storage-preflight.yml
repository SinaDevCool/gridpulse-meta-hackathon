name: MILP production storage preflight (read only)

on:
  push:
    branches: [codex/production-milp-preflight]
    paths:
      - scripts/check_milp_storage.py
      - scripts/test_milp_storage.py
      - .github/workflows/milp-storage-preflight.yml
      - scripts/test_scoped_claim_postgres.py
      - supabase/migrations/20261023180000_scoped_analytics_job_claim.sql
      - services/grid-data/src/grid_data/api/store.py
      - services/grid-data/src/grid_data/api/worker.py
      - services/grid-data/tests/test_durable_jobs.py
      - scripts/apply_scoped_claim.py
      - scripts/test_apply_scoped_claim.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milp-production-storage-preflight
  cancel-in-progress: false

jobs:
  qualify-scope:
    if: github.repository == 'SinaDevCool/gridpulse' && github.ref == 'refs/heads/codex/production-milp-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gridpulse_scoped_claim_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './services/grid-data[api,dev]' 'psycopg[binary]>=3,<4'
      - name: Existing worker and scoped-store regressions
        run: python -m pytest services/grid-data/tests/test_durable_jobs.py services/grid-data/tests/test_job_runner_boundaries.py -q
      - name: Real PostgreSQL concurrency, ACL, cancellation and lease tests
        run: python -m unittest discover -s scripts -p test_scoped_claim_postgres.py -v
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only-not-a-production-secret@localhost:5432/gridpulse_scoped_claim_ci
      - name: Check existing API style without rewriting files
        run: python -m ruff format --check services/grid-data/src/grid_data/api/store.py services/grid-data/src/grid_data/api/worker.py
      - name: Identify secure migration access (presence only)
        if: always()
        env:
          MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATABASE_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python - <<'PY'
          import json, os
          print(json.dumps({key + '_configured': bool(os.environ.get(key)) for key in
              ['MANAGEMENT_TOKEN', 'DATABASE_URL', 'DATABASE_PASSWORD']}))
          PY
  apply-approved-scope:
    needs: qualify-scope
    if: github.repository == 'SinaDevCool/gridpulse' && github.ref == 'refs/heads/codex/production-milp-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify guarded migration tooling
        run: python -m unittest discover -s scripts -p test_apply_scoped_claim.py -v
      - name: Apply only the user-approved scoped-claim migration
        run: python scripts/apply_scoped_claim.py --apply
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoped-claim-before-${{ github.run_id }}-${{ github.run_attempt }}
          path: scoped-claim-before.json
          if-no-files-found: ignore
          retention-days: 7
  inspect:
    needs: apply-approved-scope
    if: github.repository == 'SinaDevCool/gridpulse' && github.ref == 'refs/heads/codex/production-milp-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test read-only safeguards (no dependencies or browser)
        run: python -m unittest discover -s scripts -p test_milp_storage.py -v
      - name: Inspect existing storage metadata without writes or customer rows
        run: python scripts/check_milp_storage.py
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
