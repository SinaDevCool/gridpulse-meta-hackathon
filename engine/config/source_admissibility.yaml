    temporal_resolution: not applicable
    geographic_resolution: Frankfurt/Rhine-Main operator area
    publication_revision_semantics: not applicable to an event archive
    units: none
    licence: site terms restrict reproduction without permission
    permitted_uses: [operator_identity, process_context]
    prohibited_uses: [event_training, redistribution, nodal_headroom]
    as_known_reconstruction: false
