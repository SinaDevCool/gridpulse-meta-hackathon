  - id: stromnetz_berlin_regional_load
    publisher: Stromnetz Berlin GmbH
    authority: distribution_system_operator
    dataset: Historie Jahreshöchstlast Netzlast und Hochspannung
    url: https://www.stromnetz.berlin/files/globalassets/dokumente/opendata/veroffentlichungspflichten/historie-jahreshoechstlast-hochspannung-berlin.xlsx
    access: public XLSX
    authentication: none
    historical_coverage: aggregate history contains 454989 quarter-hours; high-voltage sheets cover 2020-2025 with 210432 quarter-hours
    temporal_resolution: 15 minutes
    geographic_resolution: Berlin total or published voltage level; not a substation
    publication_revision_semantics: each annual sheet declares a later Stand date; earlier workbook revisions are not exposed
    units: kW explicitly declared in each profiled high-voltage sheet
    licence: website reuse terms require review; no separate open-data licence confirmed
    permitted_uses: [regional_load_context_after_timestamp_validation]
    prohibited_uses: [substation_loading, nodal_headroom, available_connection_mw]
    as_known_reconstruction: false
    zero_semantics_validated: true
    admitted_for_training: false
    decision: Real regional load is available, but local timestamps lack offsets and annual files were published after the measured year; quarantine until DST and publication-aware use are explicitly bounded.
  - id: wesernetz_regional_load_2025
    publisher: wesernetz Bremen GmbH
    authority: distribution_system_operator
    dataset: Übergabe vorgelagertes Netz plus generation minus feedback, Bremen and Bremerhaven
    url: https://www.wesernetz.de/fuer-partner/energielieferanten/stromnetz/strukturdaten-des-bremer-und-bremerhavener-stromnetzes
    access: public CSV
    authentication: none
    historical_coverage: 2025 files captured; 35040 quarter-hours for each of Bremen and Bremerhaven
    temporal_resolution: 15 minutes
    geographic_resolution: Bremen or Bremerhaven regional aggregate
    publication_revision_semantics: annual current download; prior publication revisions are not exposed
    units: MW validated against published annual maximum; energy summary is separate
    licence: no separate open-data licence confirmed
    permitted_uses: [regional_load_context_after_timestamp_validation]
    prohibited_uses: [substation_loading, nodal_headroom, available_connection_mw]
    as_known_reconstruction: false
    zero_semantics_validated: true
    admitted_for_training: false
