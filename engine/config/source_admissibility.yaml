schema_version: source-admissibility-v1
assessed_at: 2026-08-16
training_gate: all_required_fields_must_be_true
sources:
  - id: edis_completed_measures
    publisher: E.DIS Netz GmbH
    authority: distribution_system_operator
    dataset: Abgeschlossene Einspeisemanagement- und Redispatch-Maßnahmen
    url: https://www.e-dis-netz.de/de/energie-einspeisen/redispatch-2-0/einspeisemanagement/veroeffentlichungen/abgeschlossene-massnahmen.html
    access: interactive table with CSV/XLS/PDF export and RSS
    authentication: none observed
    historical_coverage: pre-2021 Einspeisemanagement and Redispatch from 2021-10-01; exact earliest retained row must be profiled
    temporal_resolution: event start/end, reported duration
    geographic_resolution: published Gebiet and Ort Engpass; not assumed to be a substation
    publication_revision_semantics: completion and later settlement corrections possible; immutable publication history not exposed
    units: duration plus control stage; MW and MWh are not guaranteed by the displayed schema
    licence: no open-data licence identified; retain source citation and seek reuse confirmation for redistribution
    permitted_uses: [internal_research, public_constraint_context_with_attribution]
    prohibited_uses: [nodal_available_mw, connection_feasibility, zero_from_no_rows]
    as_known_reconstruction: false
    zero_semantics_validated: false
    admitted_for_training: false
    decision: Strong regional event candidate, but historical publication/revision reconstruction, reuse terms, and empty-result semantics are unresolved.
  - id: netztransparenz_redispatch
    publisher: German transmission system operators
    authority: transmission_system_operators
    dataset: Redispatchmaßnahmen
    url: https://www.netztransparenz.de/de-de/Systemdienstleistungen/Betriebsfuehrung/Redispatch
    access: web table/download; archive ZIP for 2013-2020
    authentication: none observed
    historical_coverage: 2013 onward with material regime changes in 2021 and 2023
    temporal_resolution: daily publication with event start/end and interval-aware summary quantities
    geographic_resolution: requesting/instructing TSO and affected plant context; not DSO-node loading
    publication_revision_semantics: current tables can change; immutable revision archive not established
    units: MW average/maximum and MWh work, with a documented non-zero-interval averaging rule
    licence: no open-data licence confirmed on the dataset page
    permitted_uses: [national_or_control_area_constraint_context, internal_research]
    prohibited_uses: [distribution_nodal_headroom, capacity_offer, treating_regime_breaks_as_equivalent]
    as_known_reconstruction: false
    zero_semantics_validated: false
    admitted_for_training: false
    decision: Machine-readable and authoritative, but revision history, licensing, and coverage discontinuities block V1 training admission.
  - id: entsoe_a63_redispatch
    publisher: ENTSO-E Transparency Platform
    authority: european_tso_platform
    dataset: A63 redispatch mode / Article 13.1.a
    url: https://transparency.entsoe.eu/content/static_content/download?path=%2FStatic%20content%2Fweb%20api%2FIG-for-TP-data-extraction-process.pdf
    access: authenticated REST API returning XML
    authentication: ENTSO-E security token
    historical_coverage: authenticated bounded probe performed for 2026-08-15 through 2026-08-16
    temporal_resolution: document time series
    geographic_resolution: in/out domains; no automatic distribution-node identity
    publication_revision_semantics: the REST API rejected DOCUMENT_TYPE A63 as an invalid or unavailable extraction combination; no A63 records were returned
    units: document-specific and must be profiled
    licence: ENTSO-E terms restrict use to Transparency Purpose; downstream reuse review required
    permitted_uses: [transparency_research_within_platform_terms]
    prohibited_uses: [distribution_nodal_headroom, unreported_outage_inference]
    as_known_reconstruction: false
    zero_semantics_validated: false
    admitted_for_training: false
    decision: Rejected for REST ingestion in V1 because the authenticated API explicitly reports that A63 is not available through this extraction combination; alternative ENTSO-E distribution channels require separate terms and archive testing.
  - id: entsoe_unavailability
    publisher: ENTSO-E Transparency Platform
    authority: european_tso_platform
    dataset: generation and transmission unavailability documents
    url: https://transparency.entsoe.eu/content/static_content/download?path=%2FStatic%20content%2Fweb%20api%2FIG-for-TP-data-extraction-process.pdf
    access: authenticated REST API returning XML
    authentication: ENTSO-E security token
    historical_coverage: bounded A78 probe for 2026-08-15 returned 464 effective documents over three offset pages
    temporal_resolution: event periods and revisions
    geographic_resolution: bidding zone or named infrastructure where published
    publication_revision_semantics: document mRID, revisionNumber and createdDateTime are returned; revisionNumber is rejected as an input parameter and mRID retrieval returned the latest effective document only
    units: MW where supplied; null otherwise
    licence: ENTSO-E terms and primary-owner rights apply
    permitted_uses: [outage_context]
    prohibited_uses: [nodal_headroom, absence_means_no_outage]
    as_known_reconstruction: false
    zero_semantics_validated: false
    admitted_for_training: false
    decision: Suitable for effective/latest outage cross-validation and prospective snapshots only; superseded-version reconstruction is unavailable through the tested REST interface, so historical training remains quarantined.
  - id: smard_redispatch
    publisher: Bundesnetzagentur | SMARD.de
    authority: federal_regulator
    dataset: Redispatch, countertrading, network reserve quantities and costs
    url: https://www.smard.de/home/downloadcenter
    access: downloadable tables/files
    authentication: none
    historical_coverage: redispatch series since July 2022; product-specific coverage must be profiled
    temporal_resolution: monthly/high-resolution depending series
    geographic_resolution: Germany, bidding-zone, network-level and energy-carrier aggregates
    publication_revision_semantics: monthly and continuously updated; historical snapshots are not supplied by the download centre
    units: MW, MWh, and EUR depending series; never summable across unlike definitions
    licence: CC BY 4.0 with attribution Bundesnetzagentur | SMARD.de
    permitted_uses: [national_context, aggregate_redispatch_features]
    prohibited_uses: [substation_loading, regional_measured_events, nodal_headroom]
    as_known_reconstruction: false
    zero_semantics_validated: false
    admitted_for_training: false
    decision: Reusable aggregate context, but continuous revision and coarse geography block regional event-target admission.
  - id: fifty_hertz_measures
    publisher: 50Hertz Transmission GmbH
    authority: transmission_system_operator
    dataset: Measures under section 13 EnWG / congestion management
    url: https://www.50hertz.com/desktopmodules/remit-ma/api/de/9668/rss
    access: public RSS with web detail links; CSV export and legacy annual archives also exist
    authentication: none observed
    historical_coverage: official UTC CSV exposes 171160 unique quarter-hours from 2021-09-28 through 2026-08-16; date-addressable HTML exposes numbered revision chains
    temporal_resolution: 15-minute control-area values
    geographic_resolution: 50Hertz control area; not Berlin or Brandenburg DSO nodes
    publication_revision_semantics: UTC CSV exposes the latest revision and generation timestamp; date-addressable HTML exposes prior numbered revisions with stable interval IDs; the full CSV contained 37612 intervals ending above revision one and a maximum final revision of 31
    units: separate increase and reduction MW values; they are preserved separately and never netted implicitly
    licence: no open-data licence confirmed
    permitted_uses: [upstream_control_area_constraint_context]
    prohibited_uses: [distribution_nodal_headroom, connection_feasibility]
    as_known_reconstruction: experimentally_reconstructable_from_currently_served_revision_pages_but_not_an_operator_immutable_archive
    zero_semantics_validated: true_for_published_intervals
    admitted_for_training: false
    decision: Suitable for an explicitly experimental 50Hertz-control-area risk backtest after complete coverage validation; operational release remains blocked because publisher-side immutability, deletion semantics and reuse terms are unconfirmed.
  - id: fifty_hertz_transmission_outages
    publisher: 50Hertz Transmission GmbH
    authority: transmission_system_operator
    dataset: Outage and planning RSS
    url: https://www.50hertz.com/Transparency/GridData/Congestionmanagement/OutageandPlanning?view=rss&SplitView=false
    access: public rolling RSS with stable event/version links
    authentication: none
    historical_coverage: rolling 100-version window observed on 2026-08-16; annual planned-outage PDFs exist separately
    temporal_resolution: event start/end with timezone-aware publication timestamp
    geographic_resolution: named transmission asset and 50Hertz control area
    publication_revision_semantics: GUID contains event and version identifiers; pubDate is UTC; rolling feed does not retain a complete historical revision archive
    units: affected capacity is a percentage and is not converted to MW; unknown MW remains null
    licence: no open-data licence confirmed
    permitted_uses: [prospective_asset_outage_context, identity_review]
    prohibited_uses: [equipment_rating_inference, nodal_headroom, connection_feasibility]
    as_known_reconstruction: prospective_only
    zero_semantics_validated: false
    admitted_for_training: false
    decision: Admitted only for prospective context; historical training is blocked by the rolling window and unconfirmed reuse terms.
  - id: stromnetz_berlin_redispatch
    publisher: Stromnetz Berlin GmbH
    authority: distribution_system_operator
    dataset: Redispatch process information
    url: https://www.stromnetz.berlin/einspeisen/redispatch/
    access: HTML; operational exchange through RAIDA
    authentication: public page; RAIDA is participant-only
    historical_coverage: no public historical event series identified
    temporal_resolution: not applicable
    geographic_resolution: Berlin service area
    publication_revision_semantics: not applicable to an event archive
    units: none
    licence: website terms; no event-data licence identified
    permitted_uses: [operator_identity, process_context]
    prohibited_uses: [event_training, nodal_headroom]
    as_known_reconstruction: false
    zero_semantics_validated: false
    admitted_for_training: false
    decision: Rejected as an event source; the page documents process and identifiers, not historical measures.
  - id: wesernetz_current_redispatch
    publisher: wesernetz Bremen GmbH
    authority: distribution_system_operator
    dataset: Aktuelle Redispatch-Maßnahmen
    url: https://www.wesernetz.de/fuer-einspeiser/regulierung/redispatch-2/redispatch-massnahmen
    access: HTML current-state table
    authentication: none
    historical_coverage: no retained public history identified
    temporal_resolution: event start/end and duration when populated
    geographic_resolution: Bremen service area and resource identifier
    publication_revision_semantics: current state only
    units: setpoint shown; unit semantics require profiling
    licence: no open-data licence identified
    permitted_uses: [current_public_constraint_context]
    prohibited_uses: [historical_training, zero_from_empty_page, nodal_headroom]
    as_known_reconstruction: false
    zero_semantics_validated: false
