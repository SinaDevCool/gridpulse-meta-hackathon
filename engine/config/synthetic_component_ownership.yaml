    - gridpulse-grid-core
    - gridpulse-capacity-backtest
    - production-analytics-service
    - production-web-ui
  production_integration: docs/production-integration-boundary.md
  grid_core_distribution: gridpulse-grid-core
  forbidden_dependencies:
    grid_core:
      - capacity_backtest
      - fastapi
      - supabase
    analytical_engine:
      - grid_data.api
    web_ui:
      - analytical_reimplementation
