non_authoritative_demonstrations:
  - external:gridpulse-grid-core/grid_data/synthetic_capacity.py
  - external:gridpulse-grid-core/grid_data/fifty_hertz_synthetic_capacity.py
  - external:gridpulse-grid-core/grid_data/fifty_hertz_regional_screening.py
  - src/capacity_backtest/hourly_ac.py
  - src/capacity_backtest/flex_study.py
  - src/capacity_backtest/synthetic_operator.py
rules:
  - New milestones must consume the listed authority instead of reimplementing its calculation.
  - Synthetic evidence can never be promoted to an operator truth class.
  - Large generated tables belong in OneDrive, not Git.
  - Dependencies must follow repository_boundary.dependency_order without cycles.
  - Production adapters translate canonical contracts and never reproduce calculations.
